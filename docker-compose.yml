services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: integer_legal
      POSTGRES_USER: integer_legal_admin
      POSTGRES_PASSWORD: ${INTEGER_LEGAL_POSTGRES_PASSWORD:?set INTEGER_LEGAL_POSTGRES_PASSWORD}
    ports: ["5432:5432"]
    volumes:
      - legal-postgres:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integer_legal_admin -d integer_legal"]
      interval: 5s
      timeout: 5s
      retries: 10
  identity:
    image: quay.io/keycloak/keycloak:26.1.4
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${INTEGER_LEGAL_KEYCLOAK_ADMIN_PASSWORD:-local-development-only}
    ports: ["8080:8080"]
    volumes:
      - ./infrastructure/keycloak/integer-local-realm.json:/opt/keycloak/data/import/integer-local-realm.json:ro
volumes:
  legal-postgres:
