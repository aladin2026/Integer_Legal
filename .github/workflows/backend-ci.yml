name: Backend CI
on:
  pull_request:
    paths: ["backend/**", "database/**", "docs/**", "scripts/**", "*.props", "global.json", "nuget.config", "docker-compose.yml", ".github/workflows/backend-ci.yml"]
  push:
    branches: [main, "build/**"]
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: "legal-backend-${{ github.ref }}", cancel-in-progress: true }
env:
  CI: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  SOLUTION: backend/Integer.Legal.slnx
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2
        with: { persist-credentials: false }
      - uses: actions/setup-dotnet@v5.2.0
        with: { global-json-file: global.json }
      - run: python3 scripts/validate_repository.py
      - run: python3 scripts/scan_secrets.py
      - run: dotnet restore "$SOLUTION" --configfile nuget.config
      - run: dotnet format "$SOLUTION" --verify-no-changes --no-restore
      - run: dotnet list "$SOLUTION" package --vulnerable --include-transitive
      - run: dotnet build "$SOLUTION" -c Release --no-restore
      - run: dotnet test "$SOLUTION" -c Release --no-build --logger "trx;LogFileName=backend-tests.trx" --results-directory TestResults
